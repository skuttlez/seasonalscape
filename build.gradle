plugins {
    id 'java'
}

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex('net\\.runelite.*') }
    }
    mavenCentral()
}

// Override with -PruneLiteVersion=latest.release when testing future releases.
def runeLiteVersion = findProperty('runeLiteVersion') ?: '1.13.1'
group = 'com.seasonalscape'
version = '0.1.22'

dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

test { useJUnit() }

jar { from('LICENSE') }

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.seasonalscape.SeasonalScapeLauncher'
    jvmArgs '-ea'
    args '--developer-mode'
}

tasks.register('shadowJar', Jar) {
    dependsOn testClasses
    archiveClassifier.set('all')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'com.seasonalscape.SeasonalScapeLauncher', 'Multi-Release': 'true' }
    from sourceSets.main.output
    from sourceSets.test.output
    from('LICENSE')
    from { configurations.testRuntimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', '**/module-info.class'
    exclude '**/*Test.class', '**/*Test$*.class'
    exclude 'com/retronpcswapper/**'
    exclude 'rs117/**'
}
